# Render Blueprint: the static app and the Django API on Render, data in Neon Postgres.
# The app proxies /api/* to the API so the browser sees one origin; the HttpOnly session cookie needs that.
# If Render gives either service a different hostname than below, update every URL that names it.
services:
  - type: web
    name: arcloop-api
    runtime: python
    region: singapore  # same region as the Neon database (ap-southeast-1)
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL  # Neon pooled connection string; entered in the dashboard, never committed
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: arcloop-api.onrender.com,arcloop.onrender.com
      - key: FRONTEND_URL
        value: https://arcloop.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://arcloop.onrender.com

  - type: web
    name: arcloop
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://arcloop-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

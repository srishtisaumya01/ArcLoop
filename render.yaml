# Render Blueprint for the Django API (https://arcloop.onrender.com); data in Neon Postgres.
# The app is on Vercel (https://arc-loop.vercel.app) and proxies /api/* here (vercel.json), so the browser sees one
# origin; the HttpOnly session cookie needs that. If either hostname changes, update every URL that names it.
services:
  - type: web
    name: arcloop
    runtime: python
    region: singapore  # same region as the Neon database (ap-southeast-1)
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL  # Neon pooled connection string; entered in the dashboard, never committed
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: arcloop.onrender.com,arc-loop.vercel.app
      - key: FRONTEND_URL
        value: https://arc-loop.vercel.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://arc-loop.vercel.app

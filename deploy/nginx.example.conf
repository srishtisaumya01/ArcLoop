# Example only. Not deployed, not run against real traffic: adapt host names and paths, then check it with `nginx -t`.
# One origin for the app and the API: static files from dist/, /api/ to Django (docs/DEPLOYMENT.md section 4).
# The security headers come from the single definition in deploy/securityHeaders.js:
#   npm run -s csp:print -- --https --report-only --nginx > /etc/nginx/arcloop-security-headers.conf
# (drop --report-only once the report log is clean). Re-run after any change to the policy.

# Leave port 80 only to redirect: the session cookie is Secure and is never sent over plain HTTP.
server {
  listen 80;
  server_name app.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.example.com;

  ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

  # HSTS: enable ONLY after every page works over HTTPS (docs/DEPLOYMENT.md section 3); start with a few minutes.
  # add_header Strict-Transport-Security "max-age=300" always;   (repeat it in each location below, like the other headers)

  root /srv/arcloop/dist;
  client_max_body_size 1m;  # the API takes small JSON bodies; the first request-size limit (Django enforces its own as well)

  # The API. No URI after proxy_pass: the /api/ prefix is passed through unchanged.
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;                       # Django's CSRF Origin check compares against it
    proxy_set_header X-Forwarded-Proto $scheme;        # read only when DJANGO_BEHIND_PROXY=true
    proxy_set_header X-Forwarded-For $remote_addr;     # overwrite, never append: rate limiting trusts this header
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Hashed build files never change: cache them hard. Headers are repeated per location because add_header in a
  # location replaces the ones inherited from the server block.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/arcloop-security-headers.conf;
    try_files $uri =404;
  }

  # Everything else is the single-page app: unknown paths get index.html, which must not be cached.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/arcloop-security-headers.conf;
    try_files $uri /index.html;
  }
}
